<title>증례 구술시험장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: examiner's desk — one case card in the center, timer dial at its shoulder, case ledger (30 squares) below */
:root{
  --bg:#eef1f3; --paper:#fbfcfc; --ink:#1d2a33; --muted:#5d6b75; --line:#cdd5db;
  --accent:#1f6f78; --accent-soft:#d5e8ea; --warn:#b5541c; --good:#2f7a4a; --good-soft:#dcefe2;
  --f-display:"Noto Serif KR","Nanum Myeongjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12191e;--paper:#1a242b;--ink:#e3e9ed;--muted:#9aa8b2;--line:#2e3c46;--accent:#5fb3bb;--accent-soft:#1d3a3e;--warn:#e08a55;--good:#6cc08a;--good-soft:#1d3527;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12191e;--paper:#1a242b;--ink:#e3e9ed;--muted:#9aa8b2;--line:#2e3c46;--accent:#5fb3bb;--accent-soft:#1d3a3e;--warn:#e08a55;--good:#6cc08a;--good-soft:#1d3527;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.7 var(--f-body);padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:860px;margin:0 auto;display:grid;gap:20px}
header h1{font:800 clamp(26px,5vw,36px)/1.2 var(--f-display);margin:0;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);font-size:15px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:14px}
.ctrl .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ctrl .lab{color:var(--muted);font-size:12px;letter-spacing:.06em}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.chip:focus-visible,.btn:focus-visible,.sq:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:clamp(18px,4vw,32px);display:grid;gap:18px;min-width:0}
.top{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
.eyebrow{font:500 13px var(--f-mono);color:var(--accent);letter-spacing:.04em}
.top h2{font:600 clamp(20px,3.6vw,26px)/1.35 var(--f-display);margin:4px 0 0;text-wrap:balance}
.dial{display:grid;justify-items:center;gap:6px}
.dial svg{width:92px;height:92px}
.dial .t{font:500 20px var(--f-mono);fill:var(--ink)}
.story{border-left:3px solid var(--line);padding-left:16px;min-width:0}
.story b{display:block;font-size:12px;letter-spacing:.08em;color:var(--muted);margin-top:8px}
.story b:first-child{margin-top:0}
.story br{display:none}
.q{font-weight:600;background:var(--accent-soft);border-radius:4px;padding:12px 16px;margin:0}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-size:15px;border-radius:4px;padding:8px 16px;cursor:pointer;border:1px solid var(--accent);background:var(--paper);color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--paper)}
.btn:disabled{opacity:.45;cursor:default}
.ans{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.ans li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.ans li.on{background:var(--good-soft);border-color:var(--good)}
.ans input{width:20px;height:20px;margin-top:4px;accent-color:var(--good)}
.ans label{cursor:pointer}
.ans .k{font-size:12px;color:var(--muted);letter-spacing:.06em;display:block}
.score{font:500 15px var(--f-mono);color:var(--good)}
details{border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;color:var(--accent);font-weight:500}
details p{margin:8px 0 0;color:var(--muted);font-size:15px}
.ledger{display:grid;gap:10px}
.ledger h3{font:600 16px var(--f-display);margin:0}
.rows{display:grid;gap:6px}
.row{display:grid;grid-template-columns:7.5em 1fr;gap:8px;align-items:center;font-size:13px}
.row .nm{color:var(--muted)}
.sqs{display:flex;gap:6px;flex-wrap:wrap}
.sq{width:34px;height:34px;border-radius:4px;border:1px solid var(--line);background:var(--paper);font:500 12px var(--f-mono);color:var(--ink);cursor:pointer;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.sq.cur{outline:2px solid var(--accent)}
.sq.s5,.sq.s4{background:var(--good);color:var(--paper);border-color:var(--good)}
.sq.s3,.sq.s2{background:var(--good-soft);border-color:var(--good)}
.sq.s1,.sq.s0{background:transparent;border-color:var(--warn);color:var(--warn)}
.sq.off{opacity:.3}
.sum{font-size:14px;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
@media (max-width:520px){.top{grid-template-columns:1fr}.dial{justify-items:start;grid-auto-flow:column;align-items:center}.row{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="wrap">
<header><h1>증례 구술시험장</h1><p>증례 토론 시리즈 5권, 30증례 · 질문을 읽고 시간 안에 소리 내어 답한 뒤, 모범 답안 다섯 줄 가운데 말한 것을 표시하세요.</p></header>
<div class="ctrl">
 <div class="grp" id="areas"><span class="lab">부위</span></div>
 <div class="grp"><span class="lab">순서</span><button class="chip" id="ordSeq" aria-pressed="true">차례대로</button><button class="chip" id="ordRnd" aria-pressed="false">무작위</button></div>
 <div class="grp"><span class="lab">제한 시간</span><button class="chip tm" data-s="60" aria-pressed="false">1분</button><button class="chip tm" data-s="120" aria-pressed="true">2분</button><button class="chip tm" data-s="180" aria-pressed="false">3분</button></div>
</div>
<article class="card" aria-live="polite">
 <div class="top">
  <div><div class="eyebrow" id="eb"></div><h2 id="ttl"></h2></div>
  <div class="dial"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--line)" stroke-width="7"/><circle id="arc" cx="50" cy="50" r="42" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" transform="rotate(-90 50 50)" stroke-dasharray="263.9" stroke-dashoffset="0"/><text class="t" id="tt" x="50" y="57" text-anchor="middle">2:00</text></svg>
   <button class="btn" id="go">시작</button></div>
 </div>
 <div class="story" id="story"></div>
 <p class="q" id="q"></p>
 <div class="btns"><button class="btn pri" id="show">모범 답안 보기</button><button class="btn" id="prev">이전 증례</button><button class="btn" id="next">다음 증례</button></div>
 <div id="ansBox" hidden>
  <div class="score" id="sc"></div>
  <ul class="ans" id="ans"></ul>
  <details><summary>근거 보기</summary><p id="ev"></p></details>
 </div>
</article>
<section class="ledger"><h3>성적표</h3><div class="sum" id="sum"></div><div class="rows" id="rows"></div>
<p class="note">칸 안 숫자는 말한 항목 수(5점 만점)입니다. 기록은 이 기기의 브라우저에만 저장됩니다. 증례는 모두 교육용 가상 환자입니다. 근거 논문과 DOI는 각 증례 권의 참고문헌에 있습니다.</p>
<div class="btns"><button class="btn" id="reset">기록 지우기</button><span class="note" id="rmsg"></span></div></section>
</div>
<script>
const C=[{"v": 1, "area": "어깨", "n": 1, "title": "밤에 깨는 어깨 통증, 55세 여성", "story": "<b>환자 이야기<\/b><br/>55세 여성 미용사가 석 달 전부터 오른쪽 어깨 바깥쪽이 아프다고 왔습니다. 머리 위로 손을 올릴 때와 아픈 쪽으로 누울 때 심하고, 밤에 자주 깹니다. 넘어진 적은 없습니다.<br/><b>진찰<\/b><br/>능동 거상은 끝까지 되지만 60도에서 120도 사이에서 아픈 painful arc(통증 호)가 있습니다. Neer 검사와 Hawkins 검사 양성, Jobe 검사는 통증만 있고 근력은 유지됩니다. 외회전 근력과 lift-off 검사 정상, 수동 운동 범위 정상, 목 움직임과 Spurling 검사 정상입니다.<br/><b>영상<\/b><br/>X-ray에서 견봉 아래 작은 골극 외에 특이 소견이 없습니다.", "q": "질문입니다. 가장 가능성 높은 진단과 감별할 질환, 다음 단계와 치료 계획을 말해 보십시오.", "ans": ["첫째, 진단은 subacromial pain syndrome(견봉하 통증 증후군), 즉 회전근개 건병증입니다. 근력이 유지되므로 전층 파열 가능성은 낮습니다.", "둘째, 감별은 회전근개 전층 파열, 석회성 건염, 유착성 관절낭염의 초기, 경추 5번 신경근병증, 견봉쇄골 관절염입니다. 수동 운동 범위가 정상이라 동결견은 아니고, 목 검사가 정상이라 신경근병증 가능성은 낮습니다.", "셋째, 다음 단계로 초음파로 힘줄 상태를 확인할 수 있고, 근력 약화가 없으면 MRI는 당장 필요하지 않습니다.", "넷째, 치료는 회전근개와 견갑골 안정화 운동을 12주 이상 하고, 통증이 심하면 견봉하 스테로이드 주사를 병행합니다.", "다섯째, 환자에게는 운동으로 대부분 좋아지며, 견봉을 깎는 수술이 진단적 관절경보다 낫지 않았다는 연구가 있다고 설명합니다."], "ev": "근거입니다. CSAW 연구는 회전근개가 온전하고 운동 치료와 주사에도 3개월 넘게 아픈 313명을 견봉하 감압술, 진단적 관절경만 하는 수술, 무치료로 나누었습니다. 6개월 옥스퍼드 어깨 점수는 감압술 32.7점, 관절경만 34.2점으로 차이가 없었고, 두 수술 모두 무치료보다 조금 좋았지만 임상적으로 중요한 차이는 아니었습니다."}, {"v": 1, "area": "어깨", "n": 2, "title": "넘어진 뒤 팔을 들지 못하는 62세 남성", "story": "<b>환자 이야기<\/b><br/>62세 남성이 2주 전 빙판에서 넘어지며 오른팔을 뻗은 뒤 팔을 들 수 없다고 왔습니다. 그 전에는 어깨 문제가 전혀 없었습니다.<br/><b>진찰<\/b><br/>능동 거상 70도, 수동 거상은 정상입니다. drop arm sign(팔 떨어짐 징후) 양성, external rotation lag sign(외회전 지연 징후) 양성, 삼각근 수축과 어깨 바깥쪽 감각은 정상입니다.<br/><b>영상<\/b><br/>X-ray에서 골절과 탈구는 없고, 견봉-상완 간격은 유지됩니다.", "q": "질문입니다. 진단, 확인할 것, 치료 시기와 그 이유를 말해 보십시오.", "ans": ["첫째, 진단은 급성 외상성 회전근개 파열이며, 외회전 지연 징후가 양성이므로 극상근과 극하근을 포함한 큰 파열을 의심합니다.", "둘째, 반드시 확인할 것은 겨드랑 신경 손상과 놓친 탈구, 대결절 골절입니다. 삼각근 수축과 감각이 정상이라 신경 손상 가능성은 낮습니다.", "셋째, MRI를 빨리 찍어 파열 크기, 힘줄 퇴축, 지방 변성을 확인합니다. 급성 외상성 파열은 지방 변성이 거의 없는 것이 보통입니다.", "넷째, 치료는 조기 봉합입니다. 교과서는 외상성 파열을 가능하면 수 주 안에 봉합하도록 권하는데, 시간이 지나면 힘줄이 퇴축하고 근육이 위축되어 봉합이 어려워지기 때문입니다.", "다섯째, 환자에게는 비외상성 퇴행성 파열과 달리 이 경우는 수술을 미루지 않는 것이 좋다고 설명합니다."], "ev": "대비되는 근거입니다. Kukkonen 등은 55세 이상의 비외상성 극상근 파열 180 어깨를 물리 치료, 견봉 성형술과 물리 치료, 봉합과 견봉 성형술과 물리 치료로 나누었습니다. 1년 Constant 점수는 74.1, 77.2, 77.9점으로 차이가 없었습니다. 즉 같은 회전근개 파열이라도 외상성인지 퇴행성인지가 치료를 가릅니다."}, {"v": 1, "area": "어깨", "n": 3, "title": "모든 방향으로 굳은 어깨, 52세 당뇨 여성", "story": "<b>환자 이야기<\/b><br/>52세 여성, 10년 된 당뇨 환자가 넉 달 전부터 왼쪽 어깨가 점점 아프고 굳어 뒷머리를 빗거나 등 뒤로 속옷을 채우지 못합니다. 외상은 없습니다.<br/><b>진찰<\/b><br/>능동과 수동 운동 범위가 모두 줄었고, 특히 수동 외회전이 반대쪽의 절반 이하입니다. 운동 범위 끝에서 통증이 심합니다.<br/><b>영상<\/b><br/>X-ray는 정상입니다.", "q": "질문입니다. 진단 기준이 되는 진찰 소견, 반드시 배제할 질환, 치료 선택지를 말해 보십시오.", "ans": ["첫째, 진단은 primary frozen shoulder(일차성 동결견), 유착성 관절낭염입니다. 핵심은 능동뿐 아니라 수동 운동 범위, 특히 외회전이 줄어든 것입니다.", "둘째, 반드시 배제할 것은 X-ray로 확인하는 후방 탈구와 골관절염입니다. 둘 다 수동 외회전이 제한됩니다. 동결견은 X-ray가 정상이어야 합니다.", "셋째, 당뇨와 갑상선 질환이 위험 인자이므로 혈당 조절을 확인합니다.", "넷째, 치료는 관절강 내 스테로이드 주사와 운동이 일차 선택이며, 반응이 없으면 마취하 도수 조작이나 관절경 관절낭 유리술을 고려합니다.", "다섯째, 환자에게는 저절로 좋아지는 경과가 흔하지만 1년에서 2년 걸릴 수 있다고 설명합니다."], "ev": "근거입니다. UK FROST 연구는 일차성 동결견 503명을 마취하 도수 조작, 관절경 관절낭 유리술, 스테로이드 주사를 포함한 조기 구조화 물리 치료로 나누었습니다. 12개월 옥스퍼드 어깨 점수는 38.3, 40.3, 37.2점으로 어느 쪽도 미리 정한 임상적 차이를 넘지 못했습니다. 관절경 유리술은 심각한 이상 반응이 8건으로 더 많았고, 비용 효과는 도수 조작이 가장 좋았습니다."}, {"v": 1, "area": "어깨", "n": 4, "title": "두 번 빠진 어깨, 22세 럭비 선수", "story": "<b>환자 이야기<\/b><br/>22세 남성 럭비 선수가 시합 중 오른쪽 어깨가 앞으로 빠져 응급실에서 정복받았습니다. 1년 전에도 한 번 빠졌습니다. 시즌을 계속 뛰고 싶어 합니다.<br/><b>진찰<\/b><br/>apprehension test(불안 검사) 양성, relocation test(재위치 검사)에서 불안감이 사라집니다. 겨드랑 신경 감각과 삼각근 근력은 정상입니다.<br/><b>영상<\/b><br/>CT에서 관절와 앞쪽 아래 골 결손이 관절와 너비의 약 20퍼센트이고, 상완골두 뒤쪽 위에 Hill-Sachs 병변이 있습니다.", "q": "질문입니다. 재발 위험 인자, 수술 방법의 선택 기준을 말해 보십시오.", "ans": ["첫째, 진단은 재발성 외상성 전방 불안정성이며, Bankart 병변과 관절와 골 결손, Hill-Sachs 병변이 있습니다.", "둘째, 재발 위험 인자는 젊은 나이, 남성, 접촉성 운동, 과거 재발, 관절와 골 결손입니다.", "셋째, 관절와 골 결손이 크면 관절경 Bankart 봉합만으로는 재발이 많으므로 Latarjet(라타제) 수술처럼 오훼돌기를 옮기는 골 이식을 고려합니다. 교과서는 결손 비율의 기준을 대략 20에서 25퍼센트 전후로 제시하지만, 최근에는 더 낮은 결손도 위험하다는 보고가 있어 기준이 내려가는 추세입니다.", "넷째, 관절와 결손과 Hill-Sachs 병변이 서로 걸리는지 보는 glenoid track(관절와 궤도) 개념으로 off-track이면 Hill-Sachs 쪽도 처치합니다.", "다섯째, 환자에게는 시즌 중 보존 치료는 재탈구 위험이 높고, 수술 후 접촉성 운동 복귀까지 대개 수개월이 걸린다고 설명합니다."], "ev": "이 증례의 수치 기준은 교과서 기준이며, 이번 권에서 원 논문 수치를 직접 대조하지 않았습니다."}, {"v": 1, "area": "어깨", "n": 5, "title": "갑자기 칼로 찌르듯 아픈 어깨, 45세 여성", "story": "<b>환자 이야기<\/b><br/>45세 여성 사무직이 어젯밤부터 오른쪽 어깨가 갑자기 극심하게 아파 팔을 전혀 움직이지 못한다고 왔습니다. 열은 없고 외상도 없습니다.<br/><b>진찰<\/b><br/>대결절 부위 압통이 심하고 모든 방향 움직임이 통증으로 제한됩니다. 피부 발적과 열감은 없습니다.<br/><b>영상<\/b><br/>X-ray에서 대결절 위쪽에 경계가 흐릿하고 솜털 같은 석회가 보입니다.", "q": "질문입니다. 진단과 시기, 반드시 감별할 질환, 치료를 말해 보십시오.", "ans": ["첫째, 진단은 calcific tendinitis(석회성 건염)의 흡수기입니다. 석회가 흐릿하고 솜털 같으면 흡수기로, 이때 통증이 가장 심합니다.", "둘째, 반드시 감별할 질환은 화농성 관절염과 통풍, 가성 통풍입니다. 열, 발적, 혈액 염증 수치를 확인하고, 의심되면 관절 천자를 합니다.", "셋째, 급성기 치료는 진통 소염제와 견봉하 스테로이드 주사이며, 흡수기는 저절로 좋아지는 경우가 많습니다.", "넷째, 단단하고 경계가 뚜렷한 형성기 석회로 증상이 오래가면 초음파 유도 바늘 세척술, 즉 barbotage(바보타주)를 고려합니다.", "다섯째, 환자에게는 석회는 저절로 흡수되기도 하며, 수술은 다른 치료에 반응하지 않을 때만 고려한다고 설명합니다."], "ev": "근거입니다. de Witte 등은 석회성 건염 환자 48명을 초음파 유도 바늘 세척술과 견봉하 스테로이드 주사 병행, 그리고 주사 단독으로 무작위 배정했습니다. 1년 Constant 점수는 86.0점 대 73.9점으로 세척술 병행군이 좋았고, 석회 크기 감소도 11.6밀리미터 대 5.1밀리미터로 컸습니다."}, {"v": 1, "area": "어깨", "n": 6, "title": "팔을 들지 못하는 78세 남성", "story": "<b>환자 이야기<\/b><br/>78세 남성이 수년 전부터 오른쪽 어깨가 아팠고, 최근 1년 동안 팔을 어깨 높이 이상 들지 못합니다. 밤에 아파서 잠을 설칩니다.<br/><b>진찰<\/b><br/>능동 거상 60도, 수동 거상 150도로 pseudoparalysis(가성 마비)입니다. 극상근과 극하근이 위축되어 있습니다. 삼각근 수축은 정상입니다.<br/><b>영상<\/b><br/>X-ray에서 상완골두가 위로 올라가 견봉-상완 간격이 5밀리미터 미만이고, 견봉 아래면이 오목하게 닳았으며, 관절 간격이 좁아졌습니다.", "q": "질문입니다. 진단, 분류, 치료 선택과 그 조건을 말해 보십시오.", "ans": ["첫째, 진단은 cuff tear arthropathy(회전근개 파열 관절병증)입니다.", "둘째, 방사선 분류는 Hamada classification(하마다 분류)으로 견봉-상완 간격 감소, 견봉의 오목한 변형, 관절 간격 감소, 상완골두 붕괴 순으로 단계가 올라갑니다.", "셋째, 가성 마비와 관절병증이 있는 고령 환자에서는 reverse total shoulder arthroplasty(역행성 인공 어깨 관절 치환술)가 표준 치료입니다. 삼각근으로 팔을 들게 하므로 삼각근과 겨드랑 신경이 정상이어야 합니다.", "넷째, 수술이 어려우면 진통제, 주사, 삼각근 강화 운동을 합니다.", "다섯째, 환자에게는 통증 감소와 거상 회복은 기대할 수 있지만 회전 운동 회복은 제한적이며, 감염과 탈구 같은 합병증이 있다고 설명합니다."], "ev": "이 증례의 분류와 수술 적응은 교과서 기준입니다."}, {"v": 2, "area": "팔꿈치·손목·손", "n": 1, "title": "컵을 들 때 아픈 팔꿈치, 45세 남성", "story": "<b>환자 이야기<\/b><br/>45세 남성 목수가 넉 달 전부터 오른쪽 팔꿈치 바깥쪽이 아파 커피잔을 들거나 악수할 때 힘들다고 합니다. 다른 병원에서 주사를 한 번 맞고 3주 동안 좋았다가 다시 아파졌고, 한 번 더 맞고 싶어 합니다.<br/><b>진찰<\/b><br/>외측 상과 바로 앞 아래에 압통이 있고, 저항을 주며 손목을 펴게 하면 통증이 재현되는 Cozen test(코젠 검사)와 중지 신전 저항 검사가 양성입니다. 팔꿈치 운동 범위는 정상이고, 요골 신경 감각과 손가락 신전 근력은 정상입니다.", "q": "질문입니다. 진단과 감별, 그리고 두 번째 스테로이드 주사에 대해 환자에게 어떻게 설명할지 말해 보십시오.", "ans": ["첫째, 진단은 lateral epicondylitis(외측 상과염), 즉 단요측수근신근 기시부의 건병증입니다.", "둘째, 감별은 요골 터널 증후군으로 압통이 외측 상과보다 4센티미터쯤 먼 쪽에 있고, 그 밖에 요골두 관절염, 후외측 회전 불안정성, 경추 6번 신경근병증이 있습니다.", "셋째, 영상은 대개 필요 없고, 오래 낫지 않으면 초음파로 힘줄을 봅니다.", "넷째, 치료는 활동 조절, 손목 신전근의 점진적 부하 운동, 팔뚝 밴드이며, 대부분 1년 안에 좋아집니다.", "다섯째, 환자에게는 주사가 몇 주 동안은 통증을 줄이지만 1년 뒤 결과는 오히려 나쁘고 재발이 많다는 연구가 있어 반복 주사는 권하지 않는다고 설명합니다."], "ev": "근거입니다. Coombes 등은 6주 넘게 아픈 외측 상과염 환자 165명을 스테로이드 주사, 위약 주사, 그리고 각각에 물리 치료를 더한 네 군으로 나누었습니다. 1년에 완전 회복이나 많이 좋아진 비율은 스테로이드 주사 83퍼센트, 위약 주사 96퍼센트로 스테로이드가 더 나빴고, 1년 재발은 54퍼센트 대 12퍼센트로 스테로이드 쪽이 훨씬 많았습니다. 물리 치료는 1년 결과를 바꾸지 못했습니다."}, {"v": 2, "area": "팔꿈치·손목·손", "n": 2, "title": "밤에 손이 저려 깨는 55세 여성", "story": "<b>환자 이야기<\/b><br/>55세 여성 주부가 여섯 달 전부터 오른손 엄지, 검지, 중지가 저려 밤에 깨고, 손을 털면 좋아진다고 합니다. 최근에는 단추를 채우기 어렵고 물건을 자주 떨어뜨립니다. 당뇨와 갑상선 기능 저하증이 있습니다.<br/><b>진찰<\/b><br/>Phalen 검사와 수근관 위 Tinel 징후 양성, 엄지 아래 무지구가 조금 위축되어 있고 엄지 외전 근력이 약합니다. 손바닥 엄지 쪽 피부 감각은 정상이고, 목 검사는 정상입니다.", "q": "질문입니다. 진단, 손바닥 피부 감각이 정상인 이유, 다음 검사와 치료 선택을 말해 보십시오.", "ans": ["첫째, 진단은 carpal tunnel syndrome(수근관 증후군)이며, 무지구 위축과 근력 약화가 있어 중등도 이상으로 봅니다.", "둘째, 정중 신경의 손바닥 피부 분지는 수근관 위로 지나가므로 손바닥 엄지 쪽 감각은 보존됩니다. 이 부위 감각이 떨어지면 수근관보다 몸쪽 병변, 예를 들어 원회내근 증후군이나 경추 신경근병증을 생각합니다.", "셋째, 신경 전도 검사로 중증도를 확인하고, 당뇨와 갑상선 질환 같은 위험 인자를 관리합니다.", "넷째, 경증은 야간 손목 부목과 스테로이드 주사로 시작하지만, 근위축이 있거나 보존 치료에 실패하면 수근관 유리술을 합니다.", "다섯째, 환자에게는 저림은 수술 뒤 빨리 좋아지지만, 이미 생긴 근위축은 회복이 느리거나 불완전할 수 있다고 설명합니다."], "ev": "근거입니다. Jarvik 등은 근위축 같은 탈신경 소견이 없는 수근관 증후군 환자 116명을 수술과, 손 치료와 초음파 치료를 포함한 비수술 치료로 나누었습니다. 12개월 손 기능과 증상 점수 모두 수술군이 유의하게 좋았지만, 연구진은 그 차이가 크지는 않았다고 했습니다. 두 군 모두 좋아졌고 수술 합병증은 없었습니다."}, {"v": 2, "area": "팔꿈치·손목·손", "n": 3, "title": "넘어진 뒤 손목 엄지 쪽 통증, 25세 남성", "story": "<b>환자 이야기<\/b><br/>25세 남성이 어제 축구를 하다 손을 짚고 넘어진 뒤 오른손목 엄지 쪽이 아프다고 왔습니다.<br/><b>진찰<\/b><br/>anatomical snuffbox(해부학적 코담뱃갑)와 주상골 결절에 압통이 있고, 엄지를 축 방향으로 누르면 아픕니다.<br/><b>영상<\/b><br/>손목 정면, 측면, 주상골 사진에서 골절선이 보이지 않습니다.", "q": "질문입니다. 다음 단계와 그 이유, 골절이 확인될 때의 치료를 말해 보십시오.", "ans": ["첫째, 진단은 숨은 주상골 골절 의심입니다. 첫 X-ray에서 보이지 않는 주상골 골절이 흔합니다.", "둘째, 감별은 손목 염좌, 주상월상 인대 손상, 원위 요골 골절입니다. 주상월상 간격이 벌어졌는지 확인합니다.", "셋째, 다음 단계는 엄지를 포함한 고정 후 MRI입니다. MRI가 가장 민감하고, 바로 찍을 수 없으면 고정한 채 10일에서 14일 뒤 X-ray를 다시 찍습니다.", "넷째, 골절이 확인되고 2밀리미터 이하로 어긋난 허리 부위 골절이면 석고 고정으로 시작하고, 불유합이 확인되면 그때 고정 수술을 합니다. 몸쪽 극 골절이나 많이 어긋난 골절은 처음부터 수술을 고려합니다.", "다섯째, 환자에게는 놓치면 불유합과 손목 관절염이 생길 수 있어 X-ray가 정상이어도 고정과 추가 검사가 필요하다고 설명합니다."], "ev": "근거입니다. SWIFFT 연구는 2밀리미터 이하로 어긋난 주상골 허리 골절 성인 439명을 바로 수술하는 군과 석고 고정 후 불유합만 수술하는 군으로 나누었습니다. 52주 손목 점수는 차이가 없었고, 수술군의 14퍼센트가 수술 관련 심각할 수 있는 합병증을 겪었습니다."}, {"v": 2, "area": "팔꿈치·손목·손", "n": 4, "title": "넘어져 손목이 휜 72세 여성", "story": "<b>환자 이야기<\/b><br/>72세 여성이 집 앞에서 넘어져 왼손을 짚었습니다. 혼자 살며 장을 보고 밭일을 합니다.<br/><b>진찰<\/b><br/>손목이 포크 등처럼 휘었고, 손가락 감각과 혈류는 정상입니다.<br/><b>영상<\/b><br/>원위 요골 관절 밖 골절로 등쪽 기울기 25도, 요골 단축 4밀리미터입니다. 정복 후 등쪽 기울기 5도로 좋아졌습니다.", "q": "질문입니다. 치료 선택, 수술과 석고를 비교한 근거, 함께 챙길 것을 말해 보십시오.", "ans": ["첫째, 진단은 등쪽 전위 원위 요골 골절, 즉 Colles fracture(콜리스 골절)이며 정복은 잘 되었습니다.", "둘째, 확인할 것은 정중 신경 증상, 원위 요척 관절 불안정성, 관절면 침범 여부입니다.", "셋째, 60세 이상에서는 정복 후 석고 고정으로도 1년 기능이 금속판 고정과 비슷하므로, 정복이 유지되면 석고 고정과 1주, 2주 X-ray 추적이 합리적입니다. 다시 어긋나면 활동 수준을 고려해 수술을 상의합니다.", "넷째, 함께 챙길 것은 골다공증 평가와 치료, 낙상 예방입니다. 손목 골절은 이후 고관절 골절의 신호입니다.", "다섯째, 환자에게는 모양이 약간 남을 수 있지만 기능은 대부분 회복된다고 설명합니다."], "ev": "근거입니다. CROSSFIRE 연구는 전위된 원위 요골 골절이 있는 60세 이상 166명을 손바닥 쪽 잠김 금속판과 비관혈적 정복 후 석고로 무작위 배정했습니다. 12개월 손목 점수는 19.8점 대 21.5점으로 임상적으로 중요한 차이가 없었고, 합병증도 유의한 차이가 없었습니다. 다만 환자가 느낀 치료 성공은 금속판군이 89퍼센트로 70퍼센트보다 높았습니다."}, {"v": 2, "area": "팔꿈치·손목·손", "n": 5, "title": "아기를 안으면 아픈 손목, 32세 여성", "story": "<b>환자 이야기<\/b><br/>32세 여성이 출산 두 달 뒤부터 오른손목 엄지 쪽이 아파 아기를 안기 힘들다고 합니다.<br/><b>진찰<\/b><br/>요골 경상돌기 위 제1 신전 구획에 압통과 약간의 붓기가 있습니다. 엄 함께 결정합니다."], "ev": "근거입니다. Delitto 등은 수술 후보인 50세 이상 요추 협착증 환자 169명을 감압술과 물리 치료로 무작위 배정했습니다. 2년 신체 기능 개선은 22.4점 대 19.2점으로 의향 분석에서 차이가 없었습니다. 다만 물리 치료군의 57퍼센트가 수술로 넘어가 해석에 주의가 필요합니다."}, {"v": 3, "area": "목과 허리", "n": 4, "title": "목에서 엄지로 뻗치는 저림, 50세 여성", "story": "<b>환자 이야기<\/b><br/>50세 여성 회계사가 2주 전부터 오른쪽 목과 어깨뼈 안쪽이 아프고, 팔 바깥쪽에서 엄지와 검지로 저림이 뻗칩니다. 손을 머리 위에 올리면 편하다고 합니다.<br/><b>진찰<\/b><br/>Spurling 검사 양성, shoulder abduction relief sign(어깨 외전 완화 징후) 양성, 손목 신전과 상완이두근 근력 4등급, 상완요골근 반사 감소, Hoffmann 징후 음성입니다.", "q": "질문입니다. 신경근 수준, 수근관 증후군과 감별하는 방법, 치료를 말해 보십시오.", "ans": ["첫째, 진단은 경추 6번 신경근병증이며, 원인은 대개 경추 5–6번 디스크 탈출이나 추간공 협착입니다.", "둘째, 수근관 증후군과의 감별은 목과 어깨뼈 통증, Spurling 검사, 손목 신전과 상완이두근 약화, 상완요골근 반사 감소입니다. 이들은 수근관보다 몸쪽 병변을 가리킵니다. 두 질환이 함께 있는 double crush(이중 압박)도 있습니다.", "셋째, 상위 운동 신경원 징후가 없어 척수증은 아닙니다.", "넷째, 치료는 진통제, 짧은 기간의 경구 스테로이드나 신경근 주사, 운동이며 대부분 수 주에서 수개월 안에 좋아집니다. 6에서 12주 보존 치료에도 통증이 심하거나 근력 저하가 진행하면 MRI와 수술을 상의합니다.", "다섯째, 환자에게는 대부분 수술 없이 좋아지지만, 손에 힘이 점점 빠지면 바로 다시 오라고 설명합니다."], "ev": "이 증례는 교과서 기준입니다."}, {"v": 3, "area": "목과 허리", "n": 5, "title": "젓가락질이 서툴러진 66세 남성", "story": "<b>환자 이야기<\/b><br/>66세 남성이 1년 전부터 젓가락질과 단추 채우기가 서툴러지고, 걸을 때 휘청거린다고 합니다. 목 통증은 거의 없습니다. 다른 병원에서 손목 터널 주사를 맞았지만 그대로입니다.<br/><b>진찰<\/b><br/>양손 Hoffmann 징후 양성, 손가락 탈출 징후 양성, 무릎 반사 항진, 일자 보행이 불안정합니다. 손 감각은 장갑 모양으로 흐릿합니다.<br/><b>영상<\/b><br/>MRI에서 경추 3–6번 다발성 척수 압박과 척수 내 T2 고신호가 있습니다. mJOA 점수 13점입니다.", "q": "질문입니다. 진단, 중증도, 치료와 그 이유를 말해 보십시오.", "ans": ["첫째, 진단은 degenerative cervical myelopathy(퇴행성 경추 척수증)입니다. 목 통증이 없어도 손 서툼과 보행 장애, 상위 운동 신경원 징후가 핵심입니다.", "둘째, mJOA 점수 15점 이상은 경증, 12에서 14점은 중등도, 12점 미만은 중증으로, 이 환자는 중등도입니다.", "셋째, 감별은 근위축성 측삭 경화증, 다발성 경화증, 비타민 B12 결핍, 정상압 수두증이며, 감각 이상이 없고 근섬유 다발 수축이 넓으면 운동 신경원 질환을 의심합니다.", "넷째, 중등도 이상의 척수증은 진행하는 경우가 많아 감압 수술을 권합니다. 다분절 압박이면 후방 후궁 성형술을, 후만이 있거나 K-line 음성이면 전방이나 후방 고정을 고려합니다.", "다섯째, 환자에게는 수술의 목적이 악화를 막고 기능을 개선하는 것이며, 이미 손상된 척수 기능이 완전히 돌아오지 않을 수 있다고 설명합니다."], "ev": "근거입니다. AOSpine North America 전향적 다기관 연구는 척수증 환자 278명의 감압 수술 결과를 분석했습니다. 1년 뒤 mJOA 점수, Nurick 등급, 목 장애 지수와 대부분의 삶의 질 영역이 수술 전보다 유의하게 좋아졌고, 이는 경증, 중등도, 중증 모두에서 나타났습니다. 합병증은 18.7퍼센트였습니다. 대조군이 없는 연구라는 한계가 있습니다."}, {"v": 3, "area": "목과 허리", "n": 6, "title": "밤에 심해지는 등 통증과 다리 힘 빠짐, 68세 여성", "story": "<b>환자 이야기<\/b><br/>68세 여성이 두 달 전부터 등 가운데가 아프고 밤에 누우면 더 심하다고 합니다. 일주일 전부터 다리가 무겁고 계단을 오르기 힘듭니다. 5년 전 유방암 수술을 받았습니다.<br/><b>진찰<\/b><br/>흉추 8번 극돌기 타진 통증, 양쪽 하지 근력 4등급, 무릎 반사 항진, 배꼽 아래 감각 저하가 있습니다.", "q": "질문입니다. 진단과 응급도, 처치 순서, 수술 적응과 근거를 말해 보십시오.", "ans": ["첫째, 진단은 유방암 척추 전이에 의한 metastatic spinal cord compression(전이성 척수 압박)이며 응급입니다.", "둘째, 즉시 전척추 MRI를 찍습니다. 다발 전이가 흔하기 때문입니다.", "셋째, 진단 즉시 고용량 덱사메타손을 시작하고, 종양내과, 방사선 종양학과, 척추 외과가 함께 결정합니다.", "넷째, 수술 적응은 단일 부위 압박, 척추 불안정성, 방사선 저항성 종양, 그리고 수술을 견딜 만한 전신 상태와 기대 여명입니다. SINS 점수로 불안정성을, Bilsky 등급으로 압박 정도를 평가합니다.", "다섯째, 환자에게는 걷는 기능을 지키는 것이 가장 중요하며, 마비가 오래되면 회복이 어려워 지금 서둘러야 한다고 설명합니다."], "ev": "근거입니다. Patchell 등은 전이암에 의한 척수 압박 환자 101명을 감압 수술 후 방사선 치료와 방사선 치료 단독으로 무작위 배정했습니다. 치료 후 보행 가능 비율은 84퍼센트 대 57퍼센트, 보행 유지 기간 중앙값은 122일 대 13일이었습니다."}, {"v": 4, "area": "고관절·무릎", "n": 1, "title": "넘어진 뒤 걷지 못하는 82세 여성, X-ray 정상", "story": "<b>환자 이야기<\/b><br/>82세 여성이 집에서 미끄러져 엉덩방아를 찧은 뒤 오른쪽 사타구니가 아파 걷지 못합니다. 골다공증 약은 먹지 않습니다.<br/><b>진찰<\/b><br/>다리 길이와 회전 변형은 없으나, 누운 채 다리를 들어 올리지 못하고, 고관절을 돌리면 사타구니 통증이 심합니다.<br/><b>영상<\/b><br/>골반과 고관절 정면, 측면 X-ray에서 골절선이 보이지 않습니다.", "q": "질문입니다. 다음 단계, 골절이 확인될 때의 수술 시기와 근거, 함께 챙길 것을 말해 보십시오.", "ans": ["첫째, 진단은 숨은 고관절 골절 의심입니다. 고령, 낙상, 체중 부하 불가, 하지 직거상 불가는 X-ray가 정상이어도 골절을 강하게 시사합니다.", "둘째, 다음 단계는 MRI입니다. 숨은 대퇴 경부 골절과 전자간 골절, 치골지 골절을 가장 잘 찾으며, MRI가 어려우면 CT를 찍습니다.", "셋째, 골절이 확인되면 내과적으로 준비되는 대로 가능한 빨리, 대개 48시간 안에 수술합니다. 다만 6시간 안의 초가속 수술이 사망을 줄이지는 않았습니다.", "넷째, 함께 챙길 것은 섬망 예방, 통증 조절과 신경 차단, 혈전 예방, 조기 보행, 그리고 골다공증 치료와 낙상 예방입니다.", "다섯째, 가족에게는 고관절 골절은 노인에게 생명과 독립을 위협하는 병이며, 수술 후 빨리 일어나 걷는 것이 회복의 핵심이라고 설명합니다."], "ev": "근거입니다. HIP ATTACK 연구는 45세 이상 고관절 골절 환자 2970명을 진단 6시간 안의 가속 수술과 표준 진료로 나누었습니다. 수술까지 시간 중앙값은 6시간 대 24시간이었고, 90일 사망은 9퍼센트 대 10퍼센트, 주요 합병증은 두 군 모두 22퍼센트로 차이가 없었습니다."}, {"v": 4, "area": "고관절·무릎", "n": 2, "title": "앉아 있으면 사타구니가 아픈 28세 남성", "story": "<b>환자 이야기<\/b><br/>28세 남성 축구 동호인이 1년 전부터 오른쪽 사타구니가 아프고, 오래 앉아 있거나 운전할 때 심합니다. 손으로 고관절 옆을 C자로 쥐며 아픈 곳을 설명합니다.<br/><b>진찰<\/b><br/>고관절 굴곡 90도에서 내회전이 10도로 줄었고, FADIR 검사(굴곡·내전·내회전)가 통증을 재현합니다.<br/><b>영상<\/b><br/>X-ray에서 관절 간격은 정상이고, 대퇴골두-경부 이행부가 볼록한 cam(캠) 형태입니다. MRI 관절 조영에서 전상방 관절와순 파열이 있습니다.", "q": "질문입니다. 진단, 치료 순서와 수술 근거를 말해 보십시오.", "ans": ["첫째, 진단은 femoroacetabular impingement syndrome(대퇴비구 충돌 증후군), cam형과 관절와순 파열입니다. 증상, 진찰 소견, 영상의 세 가지가 모두 맞아야 증후군으로 진단합니다.", "둘째, 감별은 스포츠 탈장, 내전근 건병증, 장요근 건 통증, 요추 신경근병증입니다.", "셋째, 치료는 활동 조절과 물리 치료 중심의 보존 치료로 시작합니다.", "넷째, 보존 치료에도 증상이 지속되고 골관절염이 없으면 관절경으로 캠 병변을 깎고 관절와순을 봉합하는 수술을 상의합니다. 이미 관절 간격이 좁아진 골관절염이 있으면 관절경의 결과가 나쁩니다.", "다섯째, 환자에게는 수술과 물리 치료 모두 좋아지며, 수술 쪽이 1년 결과가 조금 더 좋았다는 연구가 있다고 설명합니다."], "ev": "근거입니다. UK FASHIoN 연구는 골관절염이 없는 대퇴비구 충돌 증후군 환자 348명을 고관절 관절경과 개인 맞춤 물리 치료로 나누었습니다. 12개월 고관절 삶의 질 점수 차이는 6.8점으로 관절경이 좋았고, 이는 임상적으로 의미 있는 최소 차이 6.1점을 넘었습니다. 관절경군에서 수술 관련 심각한 이상 반응이 5건 있었습니다."}, {"v": 4, "area": "고관절·무릎", "n": 3, "title": "스테로이드 치료 뒤 사타구니 통증, 45세 남성", "story": "<b>환자 이야기<\/b><br/>45세 남성이 1년 전 루푸스로 고용량 스테로이드를 석 달 썼고, 소주를 매일 한 병 마십니다. 두 달 전부터 왼쪽 사타구니가 아프고 절뚝거립니다.<br/><b>진찰<\/b><br/>고관절 내회전 시 통증이 있고 운동 범위가 약간 줄었습니다.<br/><b>영상<\/b><br/>X-ray는 정상입니다.", "q": "질문입니다. 의심 진단, 다음 검사, 반대쪽 확인 여부, 병기에 따른 치료를 말해 보십시오.", "ans": ["첫째, 의심 진단은 osteonecrosis of the femoral head(대퇴골두 무혈성 괴사)입니다. 스테로이드와 음주가 대표적 위험 인자입니다.", "둘째, 다음 검사는 양측 고관절 MRI입니다. X-ray가 정상인 초기에도 이중선 징후로 진단할 수 있습니다.", "셋째, 반대쪽도 반드시 찍습니다. 양측성이 흔하고, 증상이 없는 반대쪽 병변이 발견될 수 있습니다.", "넷째, 치료는 골두가 함몰되기 전인지가 기준입니다. 함몰 전이고 괴사 범위가 작으면 관찰이나 골수 감압술 같은 골두 보존 수술을, 함몰 후나 관절염이 생기면 인공 고관절 치환술을 고려합니다. 괴사 범위와 위치가 함몰 위험을 정합니다.", "다섯째, 환자에게는 음주를 줄이고, 다른 쪽도 생길 수 있어 정기적으로 확인해야 한다고 설명합니다."], "ev": "이 증례는 교과서 기준입니다."}, {"v": 4, "area": "고관절·무릎", "n": 4, "title": "뒤틀린 뒤 퉁퉁 부은 무릎, 24세 여성", "story": "<b>환자 이야기<\/b><br/>24세 여성이 어제 농구를 하다 착지하며 무릎이 뒤틀렸고, \"뚝\" 소리 뒤 몇 시간 만에 무릎이 퉁퉁 부었습니다.<br/><b>진찰<\/b><br/>관절 혈종이 있고, Lachman 검사에서 끝 느낌이 물렁하며, 내측 측부 인대는 안정적입니다. 혈관과 비골 신경은 정상입니다.<br/><b>영상<\/b><br/>X-ray에서 경골 외측 고평부 가장자리에 작은 견열 골편인 Segond fracture(세공 골절)가 보입니다.", "q": "질문입니다. 진단과 동반 손상, 치료 선택과 근거를 말해 보십시오.", "ans": ["첫째, 진단은 전방 십자 인대 파열입니다. 비접촉 뒤틀림, 뚝 소리, 수 시간 안의 관절 혈종이 전형적이며, 세공 골절은 전방 십자 인대 파열과 강하게 연관됩니다.", "둘째, MRI로 반월상 연골 파열, 특히 봉합이 필요한 파열과 골좌상, 다른 인대 손상을 확인합니다.", "셋째, 치료는 붓기를 빼고 운동 범위와 대퇴사두근 근력을 회복하는 재활로 시작합니다.", "넷째, 재건 시기는 환자의 활동 목표, 불안정 증상, 봉합할 반월상 연골 파열 여부로 정합니다. 회전과 점프가 많은 운동으로 복귀하려 하거나 재활 뒤에도 무릎이 빠지는 느낌이 반복되면 재건합니다.", "다섯째, 환자에게는 재활을 먼저 하고 필요하면 나중에 재건해도 2년 결과가 같았고 수술을 상당수 피할 수 있었다는 연구가 있다고 설명하고 함께 결정합니다."], "ev": "근거입니다. KANON 연구는 급성 전방 십자 인대 파열의 젊고 활동적인 성인 121명을 재활과 조기 재건, 재활 후 필요 시 지연 재건으로 나누었습니다. 2년 무릎 점수 변화는 39.2점 대 39.4점으로 같았고, 지연 전략군 59명 중 36명은 재건 없이 지냈습니다."}, {"v": 4, "area": "고관절·무릎", "n": 5, "title": "MRI에서 반월상 연골 파열이 나온 56세 여성", "story": "<b>환자 이야기<\/b><br/>56세 여성이 넉 달 전부터 특별한 외상 없이 오른쪽 무릎 안쪽이 아프고, 계단을 내려갈 때 심합니다. 다른 병원 MRI에서 내측 반월상 연골 후각 수평 파열이 나와 관절경 수술을 권유받았습니다. 무릎이 걸리거나 잠긴 적은 없습니다.<br/><b>진찰<\/b><br/>내측 관절선 압통, McMurray 검사에서 통증만 있고 걸리는 소리는 없습니다.<br/><b>영상<\/b><br/>체중 부하 X-ray에서 내측 관절 간격이 조금 좁아졌습니다(Kellgren-Lawrence 2등급).", "q": "질문입니다. 증상의 원인 해석, 관절경 수술에 대한 의견과 근거, 치료를 말해 보십시오.", "ans": ["첫째, 진단은 초기 내측 골관절염과 동반된 퇴행성 반월상 연골 파열입니다. 중년 이후 MRI의 퇴행성 파열은 증상이 없는 사람에게도 흔해, 통증의 원인이라고 단정하기 어렵습니다.", "둘째, 감별은 거위발 건염과 점액낭염, 연골하 기능 부전 골절입니다. 갑자기 심해진 야간통이면 연골하 기능 부전 골절을 MRI로 다시 봅니다.", "셋째, 기계적 잠김이 없는 퇴행성 파열에서 관절경 부분 절제술은 가짜 수술보다 낫지 않았으므로 권하지 않습니다.", "넷째, 치료는 대퇴사두근과 고관절 근력 운동, 체중 관리, 진통제이며, 필요하면 관절강 주사를 합니다.", "다섯째, 환자에게는 \"MRI에 찢어진 것이 보인다\"는 것이 곧 수술이 필요하다는 뜻은 아니며, 운동이 수술만큼 효과가 있다고 설명합니다."], "ev": "근거입니다. 핀란드 FIDELITY 연구는 골관절염이 없는 퇴행성 내측 반월상 연골 파열 환자 146명을 관절경 부분 절제술과 가짜 수술로 이중 맹검 무작위 배정했습니다. 12개월 Lysholm 점수, WOMET 점수, 운동 후 통증 모두 차이가 없었습니다. 이 환자처럼 초기 관절염이 있으면 부분 절제술의 이득은 더 기대하기 어렵습니다."}, {"v": 4, "area": "고관절·무릎", "n": 6, "title": "50미터도 걷기 힘든 무릎, 70세 남성", "story": "<b>환자 이야기<\/b><br/>70세 남성이 10년 전부터 양쪽 무릎이 아프고, 최근 오른쪽은 50미터만 걸어도 쉬어야 하며 밤에도 아픕니다. 1년 넘게 운동 치료, 체중 감량, 진통제, 주사를 했습니다. 당뇨는 잘 조절되고, 체질량 지수 29입니다.<br/><b>진찰<\/b><br/>오른쪽 무릎 내반 변형 8도, 굴곡 구축 10도, 굴곡 110도입니다.<br/><b>영상<\/b><br/>체중 부하 X-ray에서 내측 관절 간격이 소실된 Kellgren-Lawrence 4등급입니다.", "q": "질문입니다. 치료 결정과 근거, 수술 전 확인할 것, 환자 설명을 말해 보십시오.", "ans": ["첫째, 진단은 말기 내측 구획 골관절염입니다.", "둘째, 충분한 보존 치료에도 통증과 기능 장애가 심하므로 인공 슬관절 전치환술의 적응입니다. 내측 구획만 침범하고 인대가 온전하면 단과 치환술도 고려할 수 있습니다.", "셋째, 수술 전에는 감염원, 특히 피부와 치아, 소변을 확인하고, 당화 혈색소, 심폐 기능, 혈전 위험, 동반된 고관절 병변과 허리 병변을 확인합니다.", "넷째, 수술 뒤에는 조기 보행과 재활, 혈전 예방을 합니다.", "다섯째, 환자에게는 수술이 통증과 기능을 크게 좋게 하지만 감염, 혈전, 강직 같은 심각한 합병증도 비수술 치료보다 많다는 것을 수치로 설명하고, 수술 후에도 무릎이 완전히 정상처럼 느껴지지 않는 사람이 일부 있다고 알려 줍니다."], "ev": "근거입니다. Skou 등은 인공 슬관절 치환술 대상인 중등도에서 중증 골관절염 환자 100명을 치환술과 12주 비수술 치료, 그리고 비수술 치료 단독으로 무작위 배정했습니다. 12개월 무릎 점수 개선은 32.5점 대 16.0점으로 치환술이 컸지만, 심각한 이상 반응도 24건 대 6건으로 많았습니다. 비수술군의 26퍼센트만 12개월 안에 치환술을 받았습니다."}, {"v": 5, "area": "발목·발·소아·종양", "n": 1, "title": "미끄러져 발목이 꺾인 72세 여성", "story": "<b>환자 이야기<\/b><br/>72세 여성이 빙판에서 미끄러져 오른쪽 발목이 바깥으로 꺾였습니다. 당뇨병이 있고 혈당 조절이 좋지 않으며, 담배를 피웁니다. 혼자 지팡이 없이 걸어 다니던 분입니다.<br/><b>진찰<\/b><br/>발목이 붓고 변형이 있으며, 피부는 아직 온전하고 발등 동맥이 만져집니다.<br/><b>영상<\/b><br/>발목 X-ray에서 비골 원위부 골절과 내과 골절이 함께 있는 양과 골절이며, 거골이 바깥으로 밀려 있습니다.", "q": "질문입니다. 진단과 응급 처치, 수술과 비수술 치료 중 무엇을 고를지, 그 근거를 말해 보십시오.", "ans": ["첫째, 진단은 unstable ankle fracture(불안정 발목 골절), 양과 골절과 거골 아탈구입니다.", "둘째, 응급 처치는 바로 정복하여 거골을 제자리에 돌려놓고, 부목을 대고 다리를 올려 피부를 보호하는 것입니다. 신경과 혈관 상태를 정복 전후로 기록합니다.", "셋째, 치료 선택에서는 수술 고정과 밀착 석고를 모두 제시합니다. 당뇨와 흡연은 수술 상처 문제의 위험을 높이므로, 이 환자에게는 마취 아래 정복 후 밀착 석고가 좋은 선택지입니다.", "넷째, 석고를 고르면 매주 X-ray로 정복 소실을 확인하고, 정복이 유지되지 않으면 수술로 바꿉니다.", "다섯째, 환자에게는 6개월 기능은 두 방법이 비슷하고, 수술은 감염과 상처 문제가 많고, 석고는 뼈가 약간 어긋나게 붙을 가능성과 도중에 수술로 바뀔 가능성이 있다고 설명합니다."], "ev": "근거입니다. AIM 연구는 불안정 발목 골절이 있는 60세 이상 성인 620명을 수술과 밀착 석고로 나누었습니다. 6개월 발목 기능 점수는 66.0점 대 64.5점으로 동등했습니다. 감염과 상처 벌어짐은 수술군 10퍼센트 대 석고군 1퍼센트로 수술군에 많았고, 영상상 부정 유합은 석고군 15퍼센트 대 수술군 3퍼센트로 석고군에 많았습니다. 석고군의 19퍼센트는 정복 소실로 나중에 수술을 받았습니다."}, {"v": 5, "area": "발목·발·소아·종양", "n": 2, "title": "배드민턴 중 뒤꿈치를 맞은 듯한 46세 남성", "story": "<b>환자 이야기<\/b><br/>46세 남성이 배드민턴을 하다 뒤로 물러서는 순간 누가 종아리 뒤를 찬 것 같은 느낌과 함께 쓰러졌습니다. 지금은 절뚝이며 걸을 수 있습니다.<br/><b>진찰<\/b><br/>엎드린 자세에서 아킬레스건에 움푹 들어간 곳이 만져지고, Thompson 검사에서 종아리를 쥐어도 발이 아래로 움직이지 않습니다. 쉬는 자세에서 발목이 반대쪽보다 덜 굽어 있습니다.<br/><b>영상<\/b><br/>초음파에서 종골 부착부 위 5센티미터 부위에 건 완전 파열이 있습니다.", "q": "질문입니다. 진단, 걸을 수 있다는 점의 의미, 수술과 비수술 치료의 선택, 비수술 치료의 고정 방법을 말해 보십시오.", "ans": ["첫째, 진단은 acute Achilles tendon rupture(급성 아킬레스건 파열)입니다. Thompson 검사 양성, 만져지는 틈, 쉬는 자세의 굽힘 소실이 핵심입니다.", "둘째, 걸을 수 있고 발끝을 약하게 내릴 수 있어도 파열을 배제하지 못합니다. 다른 굴곡근이 움직임을 대신하므로 초기에 염좌로 오진되는 경우가 많습니다.", "셋째, 치료는 수술과 비수술 모두 가능합니다. 조기 체중 부하와 재활을 하는 비수술 치료는 수술과 재파열률 차이가 크지 않다는 연구가 많고, 수술은 상처와 신경 손상 위험이 있습니다.", "넷째, 비수술 치료를 고르면 발끝을 아래로 둔 자세로 시작하여, 석고 대신 뒤꿈치 쐐기를 넣은 기능성 보조기로 조기 체중 부하를 할 수 있습니다.", "다섯째, 환자에게는 어느 방법이든 회복에 여러 달이 걸리고, 처음 몇 달은 발목을 갑자기 위로 젖히는 동작을 피해야 한다고 설명합니다."], "ev": "근거입니다. UKSTAR 연구는 비수술 치료를 받는 아킬레스건 파열 환자 540명을 석고와 기능성 보조기로 나누었습니다. 9개월 아킬레스건 파열 점수는 74.4점 대 72.8점으로 차이가 없었고, 재파열은 6퍼센트 대 5퍼센트로 비슷했습니다. 비용은 보조기 쪽이 약간 낮았습니다."}, {"v": 5, "area": "발목·발·소아·종양", "n": 3, "title": "아침 첫발이 아픈 52세 여성", "story": "<b>환자 이야기<\/b><br/>52세 여성이 석 달 전부터 아침에 일어나 첫발을 디딜 때 뒤꿈치 안쪽이 찌르듯 아프고, 몇 걸음 걸으면 나아집니다. 최근 체중이 늘었고 하루 종일 서서 일합니다.<br/><b>진찰<\/b><br/>종골 내측 결절 부위에 압통이 있고, 발가락을 위로 젖히면 통증이 심해집니다. 종아리 근육이 짧아 무릎을 편 채 발목을 위로 젖히는 각도가 줄었습니다. 발바닥 저림은 없습니다.<br/><b>영상<\/b><br/>X-ray에서 뒤꿈치 뼈 돌기가 있습니다.", "q": "질문입니다. 진단, 감별할 질환, 뼈 돌기의 의미, 단계별 치료를 말해 보십시오.", "ans": ["첫째, 진단은 plantar fasciitis(족저 근막염)입니다. 아침 첫발 통증과 종골 내측 결절 압통이 전형적입니다.", "둘째, 감별은 종골 피로 골절(뒤꿈치를 양옆에서 쥐면 아픔), 족근관 증후군과 Baxter 신경 포착(저림과 신경 증상), 뒤꿈치 지방 패드 위축, 그리고 양측성이면 척추 관절병증입니다.", "셋째, 뒤꿈치 뼈 돌기는 증상이 없는 사람에게도 흔하므로 통증의 원인으로 보지 않으며, 돌기를 깎는 수술은 하지 않습니다.", "넷째, 치료는 족저 근막과 종아리 스트레칭, 쿠션 있는 신발과 뒤꿈치 깔창, 체중 조절로 시작하고, 야간 부목을 더합니다. 대부분 6개월에서 12개월 안에 좋아집니다. 스테로이드 주사는 단기 효과가 있지만 근막 파열과 지방 패드 위축 위험이 있어 반복하지 않으며, 6개월 이상 낫지 않으면 체외 충격파를 고려합니다.", "다섯째, 환자에게는 시간이 걸리지만 대부분 수술 없이 좋아지며, 꾸준한 스트레칭이 가장 중요하다고 설명합니다."], "ev": "이 증례는 교과서 기준입니다."}, {"v": 5, "area": "발목·발·소아·종양", "n": 4, "title": "열이 나며 다리를 딛지 못하는 5세 남아", "story": "<b>환자 이야기<\/b><br/>5세 남아가 이틀 전부터 왼쪽 다리를 절다가 오늘은 아예 딛지 못합니다. 어제부터 열이 났고, 일주일 전 감기를 앓았습니다.<br/><b>진찰<\/b><br/>체온 38.9도이고, 왼쪽 고관절을 약간 굽히고 바깥으로 돌린 채 움직이지 않으려 합니다. 고관절을 조금만 돌려도 심하게 웁니다.<br/><b>검사와 영상<\/b><br/>혈청 백혈구 15,800, 적혈구 침강 속도 55 mm/h, C 반응성 단백 6.2 mg/dL입니다. 초음파에서 왼쪽 고관절에 관절 삼출이 있습니다.", "q": "질문입니다. 감별할 두 질환, 예측 인자로 본 확률, 다음 단계와 치료를 말해 보십시오.", "ans": ["첫째, 감별할 두 질환은 septic arthritis(화농성 관절염)와 transient synovitis(일과성 활막염)입니다.", "둘째, Kocher의 네 인자인 발열 병력, 체중 부하 불가, 적혈구 침강 속도 40 이상, 백혈구 12,000 초과가 모두 있어, 원 연구 기준 확률은 99퍼센트를 넘습니다. C 반응성 단백 2 mg/dL 초과도 위험을 높이는 인자로 함께 봅니다.", "셋째, 다음 단계는 초음파 유도 관절 천자입니다. 관절액 백혈구 수, 그람 염색, 배양을 보내고, 혈액 배양도 함께 합니다.", "넷째, 화농성 관절염이면 응급으로 관절 세척과 배농을 하고, 배양 결과를 기다리며 경험적 항생제를 정맥으로 시작합니다. 같은 부위의 골수염이 함께 있는지 MRI로 확인합니다.", "다섯째, 부모에게는 고관절 감염은 늦으면 골두 괴사와 성장판 손상으로 평생 장애가 남을 수 있어 오늘 바로 처치해야 한다고 설명합니다."], "ev": "근거입니다. Kocher 등은 급성으로 고관절이 아픈 소아를 분석해 발열 병력, 체중 부하 불가, 적혈구 침강 속도 40 이상, 혈청 백혈구 12,000 초과의 네 가지 독립 예측 인자를 찾았습니다. 화농성 관절염의 예측 확률은 인자가 없으면 0.2퍼센트 미만, 하나면 3퍼센트, 둘이면 40퍼센트, 셋이면 93.1퍼센트, 넷이면 99.6퍼센트였습니다."}, {"v": 5, "area": "발목·발·소아·종양", "n": 5, "title": "무릎이 아프다는 13세 비만 남학생", "story": "<b>환자 이야기<\/b><br/>13세 남학생이 6주 전부터 왼쪽 무릎 앞쪽이 아프고 절뚝거립니다. 키 160센티미터에 체중 82킬로그램입니다. 다른 병원에서 무릎 X-ray가 정상이라 성장통이라는 말을 들었습니다.<br/><b>진찰<\/b><br/>무릎은 부기와 압통이 없습니다. 고관절을 굽히면 다리가 저절로 바깥으로 돌아가고, 내회전이 거의 되지 않습니다. 걸을 때 발끝이 바깥을 향합니다. 목발 없이 걸을 수 있습니다.<br/><b>영상<\/b><br/>양측 고관절 정면과 개구리 자세 측면 X-ray에서 왼쪽 대퇴골두가 경부에 대해 뒤로 미끄러져 있습니다.", "q": "질문입니다. 진단, 무릎 통증을 볼 때의 교훈, 안정성 분류와 치료, 반대쪽 처리를 말해 보십시오.", "ans": ["첫째, 진단은 slipped capital femoral epiphysis(대퇴골두 골단 분리증)입니다. 사춘기, 비만, 굴곡 시 외회전(Drehmann 징후)이 전형적입니다.", "둘째, 교훈은 소아와 청소년의 무릎 통증에서는 반드시 고관절을 진찰하고 고관절 X-ray를 찍는 것입니다. 폐쇄 신경을 통한 연관통으로 무릎만 아프다고 하는 경우가 많아 진단이 늦어집니다.", "셋째, 목발 없이 걸을 수 있으므로 안정형입니다. 걷지 못하는 불안정형은 무혈성 괴사 위험이 훨씬 높습니다. 진단되면 바로 체중 부하를 금지하고, 미끄러진 자세 그대로 나사 하나로 고정합니다. 억지로 정복하지 않습니다.", "넷째, 반대쪽도 미끄러질 수 있어 정기적으로 확인하며, 어린 나이나 내분비 질환이 있으면 반대쪽 예방 고정을 상의합니다. 비만하면 갑상선 기능 저하증 같은 내분비 원인도 생각합니다.", "다섯째, 부모에게는 더 미끄러지기 전에 빨리 고정해야 하며, 오늘부터 목발을 쓰고 체중 관리를 해야 한다고 설명합니다."], "ev": "이 증례는 교과서 기준입니다."}, {"v": 5, "area": "발목·발·소아·종양", "n": 6, "title": "밤에 무릎 위가 아프고 부은 16세 여학생", "story": "<b>환자 이야기<\/b><br/>16세 여학생이 두 달 전부터 오른쪽 무릎 위 허벅지 아래쪽이 아프고, 최근에는 밤에 자다 깰 정도로 아프며 진통제로 잘 낫지 않습니다. 운동을 하다 다쳤다고 생각하고 있습니다.<br/><b>진찰<\/b><br/>대퇴골 원위부 바깥쪽에 단단하고 움직이지 않는 덩이가 만져지고 약간 열감이 있습니다. 무릎 운동 범위는 조금 줄었습니다.<br/><b>영상<\/b><br/>X-ray에서 대퇴골 원위 골간단에 경계가 불분명한 골파괴와 골형성이 섞여 있고, 골막 반응이 삼각형으로 들려 있으며, 일부는 햇살처럼 뻗어 있습니다.", "q": "질문입니다. 의심 진단, 경고 신호, 다음 검사와 의뢰, 생검에서 지켜야 할 원칙을 말해 보십시오.", "ans": ["첫째, 의심 진단은 osteosarcoma(골육종)입니다. 청소년, 무릎 주변 골간단, Codman 삼각과 햇살 모양 골막 반응이 전형적입니다. 감별은 Ewing 육종과 골수염입니다.", "둘째, 경고 신호는 쉬어도 낫지 않는 통증, 밤에 깨는 통증, 만져지는 덩이, 외상만으로 설명되지 않는 지속 통증입니다. 운동 손상으로 넘기지 않습니다.", "셋째, 다음 검사는 병변 부위 전체를 포함한 MRI로 국소 범위와 도약 전이를 보고, 흉부 CT와 뼈 스캔이나 PET-CT로 전이를 확인합니다.", "넷째, 생검은 반드시 최종 수술을 할 근골격 종양 전문 기관에서 합니다. 생검 경로는 나중에 종양과 함께 제거할 수 있는 위치로 잡고, 잘못된 생검은 사지 보존을 어렵게 만듭니다. 영상 검사는 생검 전에 끝냅니다.", "다섯째, 환자와 부모에게는 아직 확진이 아니지만 빨리 전문 기관에서 확인해야 하며, 확진되면 수술 전후 항암 치료와 사지 보존 수술이 표준이라고 설명합니다."], "ev": "이 증례는 교과서 기준입니다."}];
const AREAS=[...new Set(C.map(c=>c.area))];
const KEY=['진단','감별','검사','치료','환자 설명'];
let st={on:new Set(AREAS),rnd:false,lim:120,i:0,order:[],sc:{},chk:{}};
try{const s=JSON.parse(localStorage.getItem('oral_v1')||'{}');st.sc=s.sc||{};}catch(e){}
function save(){try{localStorage.setItem('oral_v1',JSON.stringify({sc:st.sc}))}catch(e){}}
const $=id=>document.getElementById(id);
function build(){let idx=C.map((c,i)=>i).filter(i=>st.on.has(C[i].area));if(st.rnd){for(let k=idx.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[idx[k],idx[j]]=[idx[j],idx[k]]}}st.order=idx;st.i=0;}
AREAS.forEach(a=>{const b=document.createElement('button');b.className='chip';b.textContent=a;b.setAttribute('aria-pressed','true');b.onclick=()=>{if(st.on.has(a)){if(st.on.size>1)st.on.delete(a)}else st.on.add(a);b.setAttribute('aria-pressed',st.on.has(a));build();show();};$('areas').appendChild(b)});
$('ordSeq').onclick=()=>{st.rnd=false;$('ordSeq').setAttribute('aria-pressed','true');$('ordRnd').setAttribute('aria-pressed','false');build();show()};
$('ordRnd').onclick=()=>{st.rnd=true;$('ordRnd').setAttribute('aria-pressed','true');$('ordSeq').setAttribute('aria-pressed','false');build();show()};
document.querySelectorAll('.tm').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tm').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');st.lim=+b.dataset.s;stop();left=st.lim;draw()});
let left=120,tid=null;
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function draw(){$('tt').textContent=fmt(Math.max(left,0));$('arc').setAttribute('stroke-dashoffset',(263.9*(1-left/st.lim)).toFixed(1));$('arc').setAttribute('stroke',left<=15?'var(--warn)':'var(--accent)')}
function stop(){clearInterval(tid);tid=null;$('go').textContent=left<st.lim&&left>0?'계속':'시작'}
$('go').onclick=()=>{if(tid){stop();return}if(left<=0)left=st.lim;tid=setInterval(()=>{left--;draw();if(left<=0){stop();$('go').textContent='다시';reveal()}},1000);$('go').textContent='멈춤'};
function cur(){return C[st.order[st.i]]}
function cid(c){return c.v+'-'+c.n}
function show(){stop();left=st.lim;draw();const c=cur();
 $('eb').textContent=`증례 ${c.v}권 · ${c.area} · 증례 ${c.n}  —  ${st.i+1} / ${st.order.length}`;
 $('ttl').textContent=c.title;$('story').innerHTML=c.story;$('q').textContent=c.q;
 $('ansBox').hidden=true;$('show').disabled=false;
 $('prev').disabled=st.i===0;$('next').textContent=st.i===st.order.length-1?'처음으로':'다음 증례';
 const ul=$('ans');ul.innerHTML='';const ck=st.chk[cid(c)]||[];
 c.ans.forEach((t,k)=>{const li=document.createElement('li');const id='a'+k;li.innerHTML=`<input type="checkbox" id="${id}"><label for="${id}"><span class="k">${KEY[k]||''}</span></label>`;li.querySelector('label').append(t.replace(/^(첫째|둘째|셋째|넷째|다섯째),\s*/,''));const cb=li.querySelector('input');cb.checked=!!ck[k];li.classList.toggle('on',cb.checked);cb.onchange=()=>{li.classList.toggle('on',cb.checked);rec()};ul.appendChild(li)});
 $('ev').textContent=c.ev;ledger();}
function reveal(){$('ansBox').hidden=false;$('show').disabled=true;stop();rec(true)}
function rec(first){const c=cur();const cbs=[...$('ans').querySelectorAll('input')];st.chk[cid(c)]=cbs.map(x=>x.checked);const n=cbs.filter(x=>x.checked).length;$('sc').textContent=`말한 항목 ${n} / 5`;if(!first||!(cid(c) in st.sc)){st.sc[cid(c)]=n;save()}ledger()}
$('show').onclick=reveal;
$('next').onclick=()=>{st.i=(st.i+1)%st.order.length;show();window.scrollTo({top:0})};
$('prev').onclick=()=>{if(st.i>0){st.i--;show();window.scrollTo({top:0})}};
function ledger(){const R=$('rows');R.innerHTML='';AREAS.forEach(a=>{const row=document.createElement('div');row.className='row';row.innerHTML=`<span class="nm">${a}</span><div class="sqs"></div>`;C.forEach((c,i)=>{if(c.area!==a)return;const b=document.createElement('button');b.className='sq';const s=st.sc[cid(c)];b.textContent=s===undefined?c.n:s;if(s!==undefined)b.classList.add('s'+s);if(!st.on.has(a))b.classList.add('off');if(i===st.order[st.i])b.classList.add('cur');b.title=`${c.v}권 증례 ${c.n}: ${c.title}`;b.setAttribute('aria-label',b.title+(s!==undefined?`, ${s}점`:', 아직 안 함'));b.onclick=()=>{if(!st.on.has(a)){st.on.add(a);document.querySelectorAll('#areas .chip').forEach(x=>x.textContent===a&&x.setAttribute('aria-pressed','true'));build()}st.i=st.order.indexOf(i);show();window.scrollTo({top:0})};row.querySelector('.sqs').appendChild(b)});R.appendChild(row)});
 const done=Object.keys(st.sc).length,tot=Object.values(st.sc).reduce((x,y)=>x+y,0);$('sum').textContent=done?`푼 증례 ${done} / 30 · 평균 ${(tot/done).toFixed(1)}점 · 3점 미만 ${Object.values(st.sc).filter(x=>x<3).length}개(주황 칸부터 다시 보세요)`:'아직 푼 증례가 없습니다. 첫 증례부터 시작해 보세요.'}

build();show();
