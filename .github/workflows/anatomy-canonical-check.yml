name: Anatomy canonical source checks
on:
  push:
    branches: [preview/development]
    paths:
      - 'data/muscles-v1.json'
      - 'data/knowledge-core-v1.json'
      - 'data/mmt-safety-hold-v1.json'
      - 'index.html'
      - 'anatomy-coverage.html'
      - 'sw.js'
      - 'app-version.js'
      - 'data/m184-m205-recovery-inventory-v1.json'
      - 'data/muscle-illustration-audit-v1.json'
      - 'docs/CLAUDE_186_AUDIT.md'
      - 'src/anatomy/**'
      - 'scripts/canonical-muscle-coverage-audit.mjs'
      - 'scripts/m009-pre-model-gate.mjs'
      - 'scripts/m009-original-3d-ip-gate.mjs'
      - 'data/ip-asset-registry-v1.json'
      - 'scripts/test-canonical-muscle-resolver.mjs'
      - 'scripts/test-mmt-safety-gate.mjs'
      - 'scripts/test-knowledge-core-legacy-sync.mjs'
      - 'scripts/test-anatomy-coverage-page.mjs'
      - 'scripts/test-anatomy-pwa-cache.mjs'
      - 'scripts/auto-update-qa.mjs'
      - '.github/workflows/anatomy-canonical-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anatomy-canonical-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing PWA auto-update contract
        run: node scripts/auto-update-qa.mjs
      - name: Verify preview PWA cache and offline navigation
        run: node scripts/test-anatomy-pwa-cache.mjs
      - name: Verify Galaxy coverage page syntax and source routing
        run: node scripts/test-anatomy-coverage-page.mjs
      - name: Verify 205 identity resolution without invented clinical details
        run: node scripts/test-canonical-muscle-resolver.mjs
      - name: Verify 205 runtime and 183 legacy records remain synchronized
        run: node scripts/test-knowledge-core-legacy-sync.mjs
      - name: Verify patient-safety holds in online and offline muscle records
        run: node scripts/test-mmt-safety-gate.mjs
      - name: Check m009 pre-model registry
        run: node scripts/m009-pre-model-gate.mjs
      - name: Guard original 3D and IP evidence integrity (pending asset is not completion)
        run: node scripts/m009-original-3d-ip-gate.mjs
      - name: Audit 205 runtime records and intentional 183 legacy export
        run: node scripts/canonical-muscle-coverage-audit.mjs
