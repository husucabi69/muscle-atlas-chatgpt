name: Global QA

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, preview/development ]
  workflow_dispatch:

# Rapid Preview commits must not leave multiple expensive Chromium/Cloudflare QA
# runs competing; only the newest commit on a given ref is authoritative.
concurrency:
  group: muscle-atlas-global-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read

jobs:
  global-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enforce development governance policy
        run: node scripts/development-governance-policy-qa.mjs
      - name: Validate cervical EXAM-REAL content locks
        run: node scripts/cervical-exam-content-qa.mjs
      - name: Enforce Physical Examination generation permission gate
        run: node scripts/physical-exam-generation-permission-qa.mjs
      - name: Validate Physical Examination work queue order
        run: node scripts/list-physical-exam-work-queue-qa.mjs
      - name: Run Muscle Atlas global QA
        run: node scripts/global-qa.mjs
      - name: Run Disease Trauma native integrity QA
        run: node scripts/disease-trauma-native-qa.mjs
      - name: Run Claude Original Classroom QA
        run: node scripts/claude-library-runtime-qa.mjs
      - name: Run Claude Original exact-HTML sync regression QA
        run: node scripts/claude-original-sync-qa.mjs
      - name: Run Claude original source-integrity Service Worker QA
        run: node scripts/claude-original-source-integrity-sw-qa.mjs
      - name: Run Claude private R2 audio proxy QA
        run: node scripts/claude-r2-proxy-qa.mjs
      - name: Run Cloudflare Pages portability QA
        run: node scripts/cloudflare-pages-qa.mjs
      - name: Run OrthoOS read-only integration contract QA
        run: node scripts/integration-contract-qa.mjs
      - name: Run Android TWA static configuration QA
        run: node scripts/android-twa-qa.mjs
      - name: Run Play Store submission pack QA
        run: node scripts/play-store-submission-qa.mjs
      - name: Run Stage 15 auto-update QA
        run: node scripts/auto-update-qa.mjs
      - name: Run Stage 16 hierarchical navigation QA
        run: node scripts/hierarchical-navigation-qa.mjs
      - name: Run Stage 17 muscle illustration audit QA
        run: node scripts/muscle-illustration-audit-qa.mjs
      - name: Run IP provenance and copyright-registration readiness QA
        run: node scripts/ip-provenance-qa.mjs
      - name: Smoke copyright evidence package exporter
        run: node scripts/export-ip-registration-package.mjs all /tmp/muscle-atlas-ip-evidence
      - name: Run Atlas media gap QA
        run: node scripts/atlas-media-gap-qa.mjs
      - name: Run Stage 18 Oral Human Voice QA
        run: node scripts/oral-human-voice-qa.mjs
      - name: Run Stage 19 patient exercise illustration QA
        run: node scripts/patient-exercise-illustration-qa.mjs
      - name: Run Stage 20 ultrasound atlas 2.0 QA
        run: node scripts/ultrasound-atlas-2-qa.mjs
      - name: Run Stage 20 ultrasound source health QA
        run: node scripts/ultrasound-source-health-qa.mjs
      - name: Run Stage 21 clinical learning flow QA
        run: node scripts/clinical-learning-flow-qa.mjs
      - name: Run Stage 22 search & personal learning QA
        run: node scripts/search-personal-learning-qa.mjs
      - name: Run Stage 23 real-device offline QA
        run: node scripts/real-device-offline-qa.mjs
      - name: Run Stage 23A hierarchical navigation 3.0 QA
        run: node scripts/hierarchical-navigation-3-qa.mjs
      - name: Run Stage 23B patient exercise illustration 3.0 QA
        run: node scripts/patient-exercise-illustration-3-qa.mjs
      - name: Run specialist case quiz and differential detail QA
        run: node scripts/specialist-quiz-differential-detail-qa.mjs
      - name: Run clinical exam illustration QA
        run: node scripts/clinical-exam-illustration-qa.mjs
      - name: Run physical examination realistic asset registry QA
        run: node scripts/physical-exam-realistic-assets-qa.mjs
      - name: Run EXAM-REAL review lifecycle QA
        run: node scripts/exam-real-review-lifecycle-qa.mjs
      - name: Run EXAM-REAL lifecycle QA
        run: node scripts/exam-real-lifecycle-qa.mjs
      - name: Run EXAM-REAL realistic prompt builder QA
        run: node scripts/physical-exam-realistic-prompt-qa.mjs
      - name: Run Physical Examination candidate preflight QA
        run: node scripts/physical-exam-candidate-preflight-qa.mjs
      - name: Run Physical Examination guarded Preview connector QA
        run: node scripts/physical-exam-preview-connect-qa.mjs
      - name: Run Stage 23B realistic exercise asset pipeline QA
        run: node scripts/patient-exercise-realistic-assets-qa.mjs
      - name: Run Stage 23B realistic WebP binary integrity QA
        run: node scripts/realistic-webp-integrity-qa.mjs
      - name: Run Stage 23B realistic display fidelity QA
        run: node scripts/realistic-display-fidelity-qa.mjs
      - name: Run Stage 23B realistic candidate registration QA
        run: node scripts/register-realistic-candidate-qa.mjs
      - name: Run Stage 23B realistic asset ingest QA
        run: node scripts/realistic-asset-ingest-qa.mjs
      - name: Run Stage 23B realistic generation prompt QA
        run: node scripts/realistic-generation-prompt-qa.mjs
      - name: Run Stage 23B patient exercise render-request QA
        run: node scripts/patient-exercise-render-request-qa.mjs
      - name: Run Stage 23B render-request builder QA
        run: node scripts/build-patient-exercise-render-request-qa.mjs
      - name: Run Stage 23B pending render-brief safety QA
        run: node scripts/pending-realistic-render-brief-qa.mjs
      - name: Run Stage 23B generation permission QA
        run: node scripts/can-generate-realistic-profile-qa.mjs
      - name: Run Stage 23B realistic next-task QA
        run: node scripts/next-realistic-exercise-task-qa.mjs
      - name: Run Stage 23B reviewed candidate binary-handoff QA
        run: node scripts/reviewed-candidate-binary-handoff-qa.mjs
      - name: Run Stage 23B binary handoff queue QA
        run: node scripts/list-realistic-binary-handoff-queue-qa.mjs
      - name: Run Stage 23B reviewed binary materialization QA
        run: node scripts/materialize-reviewed-realistic-binary-qa.mjs
      - name: Run Stage 23B chunk-safe binary handoff QA
        run: node scripts/materialize-reviewed-realistic-binary-chunks-qa.mjs
      - name: Run Stage 23B binary-loss recovery QA
        run: node scripts/resolve-unrecoverable-realistic-binary-qa.mjs
      - name: Run Stage 23B disease rehabilitation roadmap QA
        run: node scripts/patient-rehab-disease-roadmap-qa.mjs
      - name: Run Stage 23B disease rehabilitation content integrity QA
        run: node scripts/patient-rehab-disease-content-qa.mjs
      - name: Run Stage 23B disease rehabilitation roadmap contract QA
        run: node scripts/disease-rehab-roadmap-contract-qa.mjs

  runtime-navigation-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/muscle-runtime-e2e.log 2>&1 &
          echo $! > /tmp/muscle-runtime-e2e.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/muscle-runtime-e2e.log
          exit 1
      - name: Run anatomy click-through runtime E2E
        run: node scripts/runtime-navigation-e2e.mjs
      - name: Run custom clinical exam illustration runtime E2E
        run: node scripts/clinical-exam-illustration-e2e.mjs
      - name: Run Stage 23B patient exercise illustration runtime E2E
        run: node scripts/patient-exercise-illustration-3-e2e.mjs
      - name: Capture Claude original classroom at mobile and desktop sizes
        run: node scripts/claude-original-visual-e2e.mjs
      - name: Open all 87 original Claude lectures on mobile and desktop representative routes
        run: node scripts/claude-original-all-lectures-e2e.mjs
      - name: Upload all-lecture navigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-all-lectures-e2e-${{ github.sha }}
          path: qa-artifacts/claude-all-lectures/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Claude original classroom visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-original-classroom-visual-${{ github.sha }}
          path: qa-artifacts/claude-original-classroom/
          if-no-files-found: warn
          retention-days: 14

  deploy-safety-gate:
    if: github.event_name == 'push' && github.ref_name == 'preview/development'
    needs: [global-qa, runtime-navigation-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify exact-SHA Cloudflare Preview and stable branch alias
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_GATE_REPOSITORY: ${{ github.repository }}
          DEPLOY_GATE_SHA: ${{ github.sha }}
          DEPLOY_GATE_REF_NAME: ${{ github.ref_name }}
          DEPLOY_GATE_EVIDENCE: /tmp/deploy-safety-evidence.json
        run: node scripts/deploy-safety-gate.mjs
      - name: Verify live Claude R2 media route without exposing bucket
        run: node scripts/claude-live-media-probe.mjs
      - name: Verify every live Claude original HTML matches Drive exact bytes
        run: node scripts/claude-live-original-fidelity-qa.mjs
      - name: Install Chromium for exact-SHA live Preview browser E2E
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Open all 87 live Claude originals through Preview mobile navigation
        env:
          CLAUDE_E2E_LIVE: 'true'
        run: node scripts/claude-original-all-lectures-e2e.mjs
      - name: Upload exact-SHA live Preview navigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-live-preview-e2e-${{ github.sha }}
          path: qa-artifacts/claude-preview-live/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload deploy-safety evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-safety-evidence-${{ github.sha }}
          path: /tmp/deploy-safety-evidence.json
          if-no-files-found: warn
          retention-days: 14
